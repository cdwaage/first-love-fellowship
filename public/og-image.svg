<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <!-- Warm texture dots -->
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.3"/>
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#C9933A" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- Top accent line -->
  <rect x="540" y="80" width="120" height="2" fill="#8B2635" opacity="0.6"/>
  <!-- Main title -->
  <text x="600" y="270" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#2C2825" text-anchor="middle" letter-spacing="-1">First Love Fellowship</text>
  <!-- Divider -->
  <rect x="560" y="310" width="80" height="1" fill="#C9933A"/>
  <!-- Tagline -->
  <text x="600" y="370" font-family="Georgia, serif" font-size="28" fill="#2C2825" opacity="0.65" text-anchor="middle" font-style="italic">Gathered around Jesus. Defined by love.</text>
  <!-- Location -->
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="18" fill="#2C2825" opacity="0.4" text-anchor="middle" letter-spacing="3">LINCOLN, CALIFORNIA</text>
  <!-- Bottom accent -->
  <rect x="540" y="510" width="120" height="2" fill="#8B2635" opacity="0.3"/>
</svg>
